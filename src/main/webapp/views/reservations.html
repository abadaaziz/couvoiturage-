<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes reservations - CovoitApp</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="/trajets" class="navbar-logo">CovoitApp</a>
    <ul class="navbar-liens">
        <li><a href="/trajets">Trajets</a></li>
        <li><a href="/reservation/mes" class="actif">Mes reservations</a></li>
        <li><a href="/notifications" class="nav-notifications">Notifications
            <span id="notif-indicator" class="nav-indicator" style="display:none;"></span>
        </a></li>
    </ul>
    <div class="navbar-actions" id="navbar-actions">
        <a href="/logout" class="btn btn-secondaire btn-sm">Deconnexion</a>
    </div>
</nav>

<main class="page-principale">
    <div class="conteneur" style="padding-top:2rem;padding-bottom:4rem;">
        <div class="titre-section">
            <h1>Mes reservations</h1>
            <p class="texte-secondaire mt-1">Suivez et annulez vos reservations</p>
        </div>

        <div id="alerte" class="alerte" style="display:none;"></div>

        <div id="chargement" class="chargement" style="display:flex;">
            <div class="spinner"></div>
            <span>Chargement de vos reservations...</span>
        </div>

        <div id="liste" class="trajets-grille"></div>

        <p id="vide" style="display:none;text-align:center;padding:3rem;color:var(--texte-secondaire);">
            Vous n'avez pas encore de reservation.
        </p>
    </div>
</main>

<footer class="footer">
    <p>© 2025 CovoitApp</p>
</footer>

<script>
async function chargerReservations() {
    const chargement = document.getElementById('chargement');
    const liste = document.getElementById('liste');
    const vide = document.getElementById('vide');
    chargement.style.display = 'flex';
    liste.innerHTML = '';
    vide.style.display = 'none';

    try {
        const reponse = await fetch('/reservation/mes?format=json', {
            credentials: 'include',
            headers: { 'Accept': 'application/json' }
        });

        if (reponse.status === 401) {
            window.location.href = '/login';
            return;
        }
        if (!reponse.ok) {
            throw new Error('Erreur serveur: ' + reponse.status);
        }

        const contentType = reponse.headers.get('Content-Type') || '';
        if (!contentType.includes('application/json')) {
            throw new Error('Reponse inattendue (pas du JSON).');
        }

        const reservations = await reponse.json();
        if (!reservations.length) {
            vide.style.display = 'block';
            return;
        }

        reservations.forEach((r) => {
            const el = document.createElement('div');
            el.className = 'carte-trajet';
            const statut = r.statut || '';
            const annulable = statut !== 'ANNULEE' && statut !== 'REMBOURSEE';
            const dateDepart = new Date(String(r.dateHeureDepart).replace(' ', 'T'));
            const supprimable = !Number.isNaN(dateDepart.getTime()) && dateDepart < new Date();

            el.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">
                    <div>
                        <p class="semi-gras">${echapper(r.villeDepart)} -> ${echapper(r.villeArrivee)}</p>
                        <p class="texte-sm texte-secondaire">Reservation #${r.id} • ${new Date(r.dateHeureDepart).toLocaleString('fr-FR')}</p>
                    </div>
                    <span class="badge">${echapper(statut)}</span>
                </div>
                <div style="margin-top:0.75rem;display:flex;justify-content:space-between;align-items:center;">
                    <p class="texte-sm">${r.nombrePlaces} place(s) • ${Number(r.montantTotal).toFixed(2)} EUR</p>
                    <div style="display:flex;gap:0.5rem;align-items:center;">
                        ${annulable ? `<button class="btn btn-danger btn-sm" data-id="${r.id}">Annuler</button>` : ''}
                        ${supprimable ? `<button class="btn btn-danger btn-sm" data-supprimer="${r.id}">Supprimer</button>` : ''}
                    </div>
                </div>
            `;

            const boutonAnnuler = el.querySelector('button[data-id]');
            if (boutonAnnuler) {
                boutonAnnuler.addEventListener('click', () => annulerReservation(r.id));
            }

            const btnSupprimer = el.querySelector('button[data-supprimer]');
            if (btnSupprimer) {
                btnSupprimer.addEventListener('click', async (e) => {
                    await supprimerReservation(r.id);
                });
            }

            liste.appendChild(el);
        });


    } catch (e) {
        afficherAlerte('Erreur: ' + e.message, 'erreur');
        console.error('Reservation load error:', e);
    } finally {
        chargement.style.display = 'none';
    }
}

async function annulerReservation(id) {
    if (!confirm('Annuler cette reservation ?')) return;

    try {
        const reponse = await fetch('/reservation/annuler', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                'Accept': 'application/json'
            },
            body: new URLSearchParams({ reservationId: String(id) }).toString()
        });
        const data = await reponse.json();

        if (reponse.ok) {
            afficherAlerte('Reservation annulee.', 'succes');
            await chargerReservations();
        } else {
            afficherAlerte(data.erreur || 'Erreur lors de l annulation.', 'erreur');
        }
    } catch (e) {
        afficherAlerte('Erreur reseau.', 'erreur');
    }
}

async function supprimerReservation(id) {
    if (!confirm('Supprimer cette reservation ?')) return;

    try {
        const reponse = await fetch('/reservation/supprimer', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                'Accept': 'application/json'
            },
            body: new URLSearchParams({ reservationId: String(id) }).toString()
        });
        const data = await reponse.json();

        if (reponse.ok) {
            afficherAlerte('Reservation supprimee.', 'succes');
            await chargerReservations();
        } else {
            afficherAlerte(data.erreur || 'Erreur lors de la suppression.', 'erreur');
        }
    } catch (e) {
        afficherAlerte('Erreur reseau.', 'erreur');
    }
}

function afficherAlerte(message, type) {
    const el = document.getElementById('alerte');
    el.className = 'alerte alerte-' + type;
    el.textContent = message;
    el.style.display = 'flex';
    setTimeout(() => {
        el.style.display = 'none';
    }, 3500);
}

function echapper(v) {
    if (v == null) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function chargerSessionNavbar() {
    try {
        const reponse = await fetch('/session/me', {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        });

        if (!reponse.ok) return;
        const data = await reponse.json();
        if (!data.connecte) return;

        const zoneActions = document.getElementById('navbar-actions');
        if (zoneActions) {
            zoneActions.innerHTML = `
                <span class="badge" style="background:rgba(34,197,94,0.16);color:#86efac;border:1px solid rgba(34,197,94,0.35);">${echapper(data.role)}</span>
                <span class="texte-sm texte-secondaire">${echapper(data.prenom)}</span>
                <a href="/logout" class="btn btn-secondaire btn-sm">Deconnexion</a>
            `;
        }
    } catch (e) {
        // Ignore navbar update errors
    }
}

async function chargerNotifIndicator() {
    const indicator = document.getElementById('notif-indicator');
    if (!indicator) return;

    try {
        const reponse = await fetch('/notifications/mes?format=json', {
            credentials: 'include',
            headers: { 'Accept': 'application/json' }
        });

        if (!reponse.ok) {
            indicator.style.display = 'none';
            return;
        }

        const notifications = await reponse.json();
        const unread = notifications.filter((n) => !n.dateLecture).length;
        if (!unread) {
            indicator.style.display = 'none';
            indicator.textContent = '';
            return;
        }

        indicator.style.display = 'inline-flex';
        indicator.textContent = unread > 99 ? '99+' : String(unread);
    } catch (e) {
        indicator.style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    chargerReservations();
    chargerNotifIndicator();
    chargerSessionNavbar();
});

</script>

</body>
</html>
