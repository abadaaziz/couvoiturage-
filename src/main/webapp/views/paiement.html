<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement — Same Trip</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="/trajets" class="navbar-logo">Same Trip</a>
    <div class="navbar-actions">
        <a href="/logout" class="btn btn-secondaire btn-sm">Déconnexion</a>
    </div>
</nav>

<main class="page-principale" style="display:flex;align-items:center;justify-content:center;padding:2rem;">
    <div class="card animation-entree" style="max-width:480px;width:100%;">

        <div style="text-align:center;margin-bottom:1.5rem;">
            <p style="font-size:3rem;">💳</p>
            <h1 style="font-size:1.5rem;margin-bottom:0.5rem;">Finaliser le paiement</h1>
            <p class="texte-secondaire texte-sm">Paiement sécurisé — fonds bloqués jusqu'à confirmation</p>
        </div>

        <!-- Récapitulatif réservation -->
        <div style="background:rgba(255,255,255,0.04);border-radius:var(--rayon-md);padding:1rem;margin-bottom:1.5rem;"
             id="recap-reservation">
            <p class="texte-secondaire texte-sm" style="text-align:center;">Chargement du récapitulatif...</p>
        </div>

        <!-- Alertes -->
        <div id="alerte-paiement" class="alerte" style="display:none;"></div>

        <!-- Formulaire -->
        <form id="form-paiement">
            <div class="form-groupe">
                <label for="methodePaiement">Méthode de paiement</label>
                <select id="methodePaiement" name="methodePaiement" class="form-controle" required>
                    <option value="CARTE_BANCAIRE">💳 Carte bancaire</option>
                    <option value="PAYPAL">🅿 PayPal</option>
                    <option value="VIREMENT">🏦 Virement bancaire</option>
                </select>
            </div>

            <!-- Simulation champs carte -->
            <div id="champs-carte">
                <div class="form-groupe">
                    <label for="num-carte">Numéro de carte</label>
                    <input type="text" id="num-carte" class="form-controle"
                           placeholder="1234 5678 9012 3456" maxlength="19"
                           pattern="[\d\s]{19}">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-groupe">
                        <label for="expiration">Expiration</label>
                        <input type="text" id="expiration" class="form-controle"
                               placeholder="MM/AA" maxlength="5">
                    </div>
                    <div class="form-groupe">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" class="form-controle"
                               placeholder="123" maxlength="3">
                    </div>
                </div>
            </div>

            <!-- Simulation PayPal -->
            <div id="champs-paypal" style="display:none;">
                <div class="form-groupe">
                    <label for="paypal-email">Email PayPal</label>
                          <input type="email" id="paypal-email" class="form-controle"
                              placeholder="nom@exemple.com">
                </div>
            </div>

            <!-- Simulation virement -->
            <div id="champs-virement" style="display:none;">
                <div class="form-groupe">
                    <label for="virement-reference">Reference de virement</label>
                          <input type="text" id="virement-reference" class="form-controle"
                              placeholder="VIR-2026-0001">
                </div>
            </div>

            <input type="hidden" id="reservationId" name="reservationId" value="">

            <button type="submit" id="btn-payer" class="btn btn-primaire w-full btn-lg">
                🔒 Payer maintenant
            </button>
        </form>

        <p class="texte-centre texte-xs texte-secondaire" style="margin-top:1rem;">
            🔒 Paiement chiffré SSL — Vos données bancaires ne sont jamais stockées
        </p>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const params = new URLSearchParams(window.location.search);
    const reservationId = params.get('reservationId') || '';
    document.getElementById('reservationId').value = reservationId;

    if (reservationId) {
        chargerRecapitulatif(reservationId);
    }


    document.getElementById('num-carte').addEventListener('input', function() {
        let val = this.value.replace(/\D/g, '').substring(0, 16);
        this.value = val.replace(/(.{4})/g, '$1 ').trim();
    });


    document.getElementById('expiration').addEventListener('input', function() {
        let val = this.value.replace(/\D/g, '').substring(0, 4);
        if (val.length >= 2) val = val.substring(0, 2) + '/' + val.substring(2);
        this.value = val;
    });


    const selectMethode = document.getElementById('methodePaiement');
    const champsCarte = document.getElementById('champs-carte');
    const champsPaypal = document.getElementById('champs-paypal');
    const champsVirement = document.getElementById('champs-virement');

    const basculerChamps = () => {
        const methode = selectMethode.value;
        champsCarte.style.display = methode === 'CARTE_BANCAIRE' ? 'block' : 'none';
        champsPaypal.style.display = methode === 'PAYPAL' ? 'block' : 'none';
        champsVirement.style.display = methode === 'VIREMENT' ? 'block' : 'none';
    };

    selectMethode.addEventListener('change', basculerChamps);
    basculerChamps();


    document.getElementById('form-paiement').addEventListener('submit', async (e) => {
        e.preventDefault();
        await traiterPaiement();
    });
});

async function chargerRecapitulatif(reservationId) {
    const zone = document.getElementById('recap-reservation');
    try {
        const reponse = await fetch('/reservation/mes?format=json', {
            credentials: 'include',
            headers: { 'Accept': 'application/json' }
        });

        if (!reponse.ok) throw new Error('Erreur serveur ' + reponse.status);
        const reservations = await reponse.json();
        const reservation = reservations.find((r) => String(r.id) === String(reservationId));

        if (!reservation) {
            zone.innerHTML = '<p class="texte-secondaire texte-sm" style="text-align:center;">Réservation introuvable.</p>';
            return;
        }

        const montant = Number(reservation.montantTotal || 0).toFixed(2);
        const places = reservation.nombrePlaces || 1;
        zone.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <p class="semi-gras texte-sm">Réservation #${reservation.id}</p>
                    <p class="texte-xs texte-secondaire">${places} place(s) • ${reservation.villeDepart} → ${reservation.villeArrivee}</p>
                </div>
                <p class="trajet-prix" style="font-size:1.25rem;">${montant} DT</p>
            </div>
        `;
    } catch (e) {
        zone.innerHTML = '<p class="texte-secondaire texte-sm" style="text-align:center;">Erreur lors du chargement du récapitulatif.</p>';
    }
}

async function traiterPaiement() {
    const btn     = document.getElementById('btn-payer');
    const alerteEl = document.getElementById('alerte-paiement');
    const methode = document.getElementById('methodePaiement').value;

    const afficherErreur = (message) => {
        alerteEl.className = 'alerte alerte-erreur';
        alerteEl.textContent = message;
        alerteEl.style.display = 'flex';
    };

    if (methode === 'CARTE_BANCAIRE') {
        const numero = document.getElementById('num-carte').value.replace(/\s/g, '');
        const expiration = document.getElementById('expiration').value.trim();
        const cvv = document.getElementById('cvv').value.trim();

        if (!/^\d{16}$/.test(numero)) {
            afficherErreur('❌ Numéro de carte invalide (16 chiffres requis).');
            return;
        }
        if (!/^\d{2}\/\d{2}$/.test(expiration)) {
            afficherErreur('❌ Expiration invalide (format MM/AA).');
            return;
        }
        if (!/^\d{3}$/.test(cvv)) {
            afficherErreur('❌ CVV invalide (3 chiffres requis).');
            return;
        }
    } else if (methode === 'PAYPAL') {
        const email = document.getElementById('paypal-email').value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            afficherErreur('❌ Email PayPal invalide.');
            return;
        }
    } else if (methode === 'VIREMENT') {
        const reference = document.getElementById('virement-reference').value.trim();
        if (!reference) {
            afficherErreur('❌ Reference de virement obligatoire.');
            return;
        }
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Traitement en cours...';
    alerteEl.style.display = 'none';

    try {
        const body = new URLSearchParams();
        body.set('reservationId', document.getElementById('reservationId').value);
        body.set('methodePaiement', methode);

        const reponse = await fetch('/paiement', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: body.toString()
        });
        const data    = await reponse.json();

        if (reponse.ok) {
            alerteEl.className = 'alerte alerte-succes';
            alerteEl.textContent = '✓ Paiement effectué ! Réf : ' + data.reference;
            alerteEl.style.display = 'flex';
            setTimeout(() => window.location.href = '/reservation/mes', 2500);
        } else if (reponse.status === 401) {
            window.location.href = '/login';
        } else {
            alerteEl.className = 'alerte alerte-erreur';
            alerteEl.textContent = '❌ ' + (data.erreur || 'Paiement refusé.');
            alerteEl.style.display = 'flex';
            btn.disabled = false;
            btn.innerHTML = '🔒 Payer maintenant';
        }

    } catch (err) {
        alerteEl.className = 'alerte alerte-erreur';
        alerteEl.textContent = '❌ Erreur réseau. Veuillez réessayer.';
        alerteEl.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = '🔒 Payer maintenant';
    }
}
</script>
</body>
</html>
