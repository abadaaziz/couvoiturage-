<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur — CovoitApp</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;">
    <div class="animation-entree">
        <p style="font-size:6rem;line-height:1;margin-bottom:1rem;">⚙️</p>
        <h1 style="font-size:5rem;font-weight:900;color:var(--couleur-danger);margin-bottom:0.5rem;">500</h1>
        <h2 style="margin-bottom:1rem;">Erreur serveur</h2>
        <p class="texte-secondaire" style="margin-bottom:2rem;max-width:400px;margin-left:auto;margin-right:auto;">
            Une erreur inattendue s'est produite. Nos équipes ont été notifiées.
            Veuillez réessayer dans quelques instants.
        </p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
            <a href="javascript:history.back()" class="btn btn-primaire btn-lg">← Retour</a>
            <a href="/"                         class="btn btn-secondaire btn-lg">Accueil</a>
        </div>
    </div>
</div>
</body>
</html>
