<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes trajets - CovoitApp</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="/trajets" class="navbar-logo">CovoitApp</a>
    <ul class="navbar-liens">
        <li><a href="/trajets">Trajets</a></li>
        <li><a href="/trajets/mes" class="actif">Mes trajets</a></li>
    </ul>
    <div class="navbar-actions">
        <a href="/logout" class="btn btn-secondaire btn-sm">Deconnexion</a>
    </div>
</nav>

<main class="page-principale">
    <div class="conteneur" style="padding-top:2rem;padding-bottom:4rem;">
        <div class="titre-section">
            <h1>Mes trajets (chauffeur)</h1>
            <p class="texte-secondaire mt-1">Confirmez les reservations et annulez un trajet si besoin.</p>
        </div>

        <div id="alerte" class="alerte" style="display:none;"></div>

        <div id="chargement" class="chargement" style="display:flex;">
            <div class="spinner"></div>
            <span>Chargement de vos trajets...</span>
        </div>

        <div id="liste-trajets" class="trajets-grille"></div>

        <p id="vide" style="display:none;text-align:center;padding:3rem;color:var(--texte-secondaire);">
            Vous n'avez pas encore propose de trajet.
        </p>
    </div>
</main>

<footer class="footer">
    <p>© 2025 CovoitApp</p>
</footer>

<script>
let etatTrajets = [];
let etatReservations = [];

function echapper(v) {
    if (v == null) return '';
    return String(v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function parserDate(v) {
    if (!v) return null;
    const d = new Date(String(v).replace(' ', 'T'));
    return Number.isNaN(d.getTime()) ? null : d;
}

function formaterDate(v) {
    const d = parserDate(v);
    if (!d) return echapper(v || 'Date inconnue');
    return d.toLocaleString('fr-FR', {
        weekday: 'short',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

function afficherAlerte(message, type) {
    const el = document.getElementById('alerte');
    el.className = 'alerte alerte-' + type;
    el.textContent = message;
    el.style.display = 'flex';
    setTimeout(() => { el.style.display = 'none'; }, 3500);
}

async function chargerDonnees() {
    const chargement = document.getElementById('chargement');
    const vide = document.getElementById('vide');
    const liste = document.getElementById('liste-trajets');

    chargement.style.display = 'flex';
    vide.style.display = 'none';
    liste.innerHTML = '';

    try {
        const [rTrajets, rReservations] = await Promise.all([
            fetch('/trajets/mes?format=json', { headers: { 'Accept': 'application/json' }, cache: 'no-store' }),
            fetch('/reservation/chauffeur?format=json', { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
        ]);

        if (rTrajets.status === 401 || rTrajets.status === 403 || rReservations.status === 401 || rReservations.status === 403) {
            window.location.href = '/login';
            return;
        }

        if (!rTrajets.ok || !rReservations.ok) {
            throw new Error('Erreur serveur');
        }

        etatTrajets = await rTrajets.json();
        etatReservations = await rReservations.json();

        afficherTrajets();

    } catch (e) {
        afficherAlerte('Impossible de charger vos trajets.', 'erreur');
    } finally {
        chargement.style.display = 'none';
    }
}

function afficherTrajets() {
    const liste = document.getElementById('liste-trajets');
    const vide = document.getElementById('vide');

    liste.innerHTML = '';

    if (!Array.isArray(etatTrajets) || etatTrajets.length === 0) {
        vide.style.display = 'block';
        return;
    }

    etatTrajets.forEach((t) => {
        const reservations = etatReservations.filter((r) => Number(r.trajetId) === Number(t.id));
        const enAttente = reservations.filter((r) => r.statut === 'EN_ATTENTE');

        const carte = document.createElement('div');
        carte.className = 'carte-trajet';

        carte.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;">
                <div>
                    <p class="semi-gras">${echapper(t.villeDepart)} -> ${echapper(t.villeArrivee)}</p>
                    <p class="texte-sm texte-secondaire">Depart: ${formaterDate(t.dateHeureDepart)}</p>
                    <p class="texte-sm texte-secondaire">Places: ${Number(t.placesDisponibles)} / ${Number(t.placesTotal)} | Prix: ${Number(t.prixParPlace).toFixed(2)} EUR</p>
                </div>
                <span class="badge">${echapper(t.statut)}</span>
            </div>

            <div style="margin-top:0.75rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
                <button class="btn btn-danger btn-sm" data-annuler-trajet="${t.id}">Annuler ce trajet</button>
            </div>

            <div style="margin-top:1rem;border-top:1px solid var(--bordure);padding-top:0.75rem;">
                <p class="semi-gras" style="margin-bottom:0.5rem;">Reservations (${reservations.length})</p>
                ${renderReservations(reservations)}
                ${enAttente.length > 0 ? '<p class="texte-xs texte-secondaire" style="margin-top:0.5rem;">Confirmez les reservations EN_ATTENTE pour valider le passager.</p>' : ''}
            </div>
        `;

        liste.appendChild(carte);
    });

    liste.querySelectorAll('button[data-confirmer]').forEach((btn) => {
        btn.addEventListener('click', async () => {
            const id = Number(btn.getAttribute('data-confirmer'));
            await confirmerReservation(id);
        });
    });

    liste.querySelectorAll('button[data-annuler-trajet]').forEach((btn) => {
        btn.addEventListener('click', async () => {
            const id = Number(btn.getAttribute('data-annuler-trajet'));
            await annulerTrajet(id);
        });
    });
}

function renderReservations(reservations) {
    if (!reservations.length) {
        return '<p class="texte-sm texte-secondaire">Aucune reservation pour ce trajet.</p>';
    }

    return reservations.map((r) => {
        const client = `${echapper(r.passagerPrenom || '')} ${echapper(r.passagerNom || '')}`.trim() || 'Passager';
        const peutConfirmer = r.statut === 'EN_ATTENTE';

        return `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:0.6rem 0;border-bottom:1px dashed var(--bordure);">
                <div>
                    <p class="texte-sm semi-gras">#${r.id} - ${client}</p>
                    <p class="texte-xs texte-secondaire">${Number(r.nombrePlaces)} place(s) - ${Number(r.montantTotal).toFixed(2)} EUR - ${echapper(r.statut)}</p>
                </div>
                ${peutConfirmer ? `<button class="btn btn-primaire btn-sm" data-confirmer="${r.id}">Confirmer</button>` : ''}
            </div>
        `;
    }).join('');
}

async function confirmerReservation(id) {
    if (!id) return;

    const payload = new URLSearchParams();
    payload.set('reservationId', String(id));

    try {
        const reponse = await fetch('/reservation/confirmer', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                'Accept': 'application/json'
            },
            body: payload.toString()
        });

        const data = await reponse.json();
        if (reponse.ok) {
            afficherAlerte('Reservation confirmee.', 'succes');
            await chargerDonnees();
        } else {
            afficherAlerte(data.erreur || 'Erreur de confirmation.', 'erreur');
        }
    } catch (e) {
        afficherAlerte('Erreur reseau lors de la confirmation.', 'erreur');
    }
}

async function annulerTrajet(trajetId) {
    if (!trajetId) return;
    if (!confirm('Annuler ce trajet ?')) return;

    const payload = new URLSearchParams();
    payload.set('trajetId', String(trajetId));

    try {
        const reponse = await fetch('/trajets/annuler', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                'Accept': 'application/json'
            },
            body: payload.toString()
        });

        const data = await reponse.json();
        if (reponse.ok) {
            afficherAlerte('Trajet annule.', 'succes');
            await chargerDonnees();
        } else {
            afficherAlerte(data.erreur || 'Erreur lors de l annulation du trajet.', 'erreur');
        }
    } catch (e) {
        afficherAlerte('Erreur reseau lors de l annulation.', 'erreur');
    }
}

document.addEventListener('DOMContentLoaded', chargerDonnees);
</script>

</body>
</html>
